name: CI/CD Docker Swarm ACR ppd

on:
  push:
    branches:
      - ppd

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_KEY_PPD }}
      - name: Login to Azure Container Registry
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login olivesoft.azurecr.io -u olivesoft --password-stdin
      - name: Build Docker image
        run: |
          docker build . \
            --build-arg GOOGLE_DRIVE_API_KEY=*** \
            --build-arg GOOGLE_DRIVE_CLIENT_ID=*** \
            --build-arg GOOGLE_PSE_API_KEY=*** \
            --build-arg GOOGLE_PSE_ENGINE_ID=*** \
            --build-arg IMAGES_OPENAI_API_KEY=*** \
            --build-arg OAUTH_CLIENT_SECRET=*** \
            --build-arg ONEDRIVE_CLIENT_ID_BUSINESS=*** \
            --build-arg ONEDRIVE_CLIENT_ID_PERSONAL=*** \
            --build-arg ONEDRIVE_SHAREPOINT_TENANT_ID=*** \
            --build-arg OPENAI_API_KEY=*** \
            --build-arg OPENID_PROVIDER_URL=https://olia-ppd.francecentral.cloudapp.azure.com:8443/realms/OliveSoft/.well-known/openid-configuration \
            --build-arg OPENID_REDIRECT_URI=https://olia-ppd.francecentral.cloudapp.azure.com/oauth/oidc/callback \
            --build-arg WEBUI_AUTH_SIGNOUT_REDIRECT_URL=https://olia-ppd.francecentral.cloudapp.azure.com \
            --build-arg ENABLE_IMAGE_PROMPT_GENERATION=True \
            --build-arg USER_PERMISSIONS_CHAT_CONTROLS=False \
            --build-arg ENABLE_OAUTH_GROUP_CREATION=true \
            --build-arg ENABLE_OAUTH_GROUP_MANAGEMENT=true \
            --build-arg ENABLE_OAUTH_SIGNUP=true \
            --build-arg ENABLE_ONEDRIVE_BUSINESS=True \
            --build-arg ENABLE_ONEDRIVE_INTEGRATION=True \
            --build-arg ENABLE_ONEDRIVE_PERSONAL=True \
            --build-arg IMAGES_OPENAI_API_BASE_URL=https://api.openai.com/v1 \
            --build-arg OAUTH_CLIENT_ID=olia-ppd \
            --build-arg OAUTH_GROUP_CLAIM=groups \
            --build-arg OAUTH_PROVIDER_NAME=Keycloak \
            --build-arg OPENAI_API_BASE_URL=https://api.openai.com/v1 \
            --build-arg ONEDRIVE_SHAREPOINT_URL=https://olivesoftfr-my.sharepoint.com/ \
            --build-arg ENABLE_FORWARD_USER_INFO_HEADERS=True \
            --build-arg USER_PERMISSIONS_FEATURES_WEB_SEARCH=True \
            --build-arg WEBUI_NAME=OLIA \
            --build-arg ATLASSIAN_CLIENT_ID=*** \
            --build-arg ATLASSIAN_CLIENT_SECRET=*** \
            --build-arg ATLASSIAN_REDIRECT_URI=https://olia-ppd.francecentral.cloudapp.azure.com/api/oauth/atlassian/callback \
            --build-arg ATLASSIAN_SCOPES="read:jira-work write:jira-work offline_access" \
            --build-arg ATLASSIAN_AUDIENCE=api.atlassian.com \
            --build-arg ATLASSIAN_POST_AUTH_REDIRECT=https://olia-ppd.francecentral.cloudapp.azure.com/ \
            --build-arg WEB_SEARCH_ENGINE=google_pse \
            --build-arg WEBUI_URL=https://olia-ppd.francecentral.cloudapp.azure.com \
            -t olivesoft.azurecr.io/open-webui-custom:latest
      - name: Push Docker image to ACR
        run: |
          docker push olivesoft.azurecr.io/open-webui-custom:latest
      - name: Deploy to Swarm VM
        run: |
          ssh -o StrictHostKeyChecking=no azureuser@10.2.0.5 "
            docker login olivesoft.azurecr.io -u olivesoft -p ${{ secrets.ACR_PASSWORD }}
            docker pull olivesoft.azurecr.io/open-webui-custom:latest
            docker service update -d --update-order start-first --with-registry-auth --image olivesoft.azurecr.io/open-webui-custom:latest keycloak_webapp
            docker system prune -af
          "
