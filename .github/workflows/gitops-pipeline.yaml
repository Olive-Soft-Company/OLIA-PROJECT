name: CI/CD AKS GitOps (PPD)
on:
  push:
    branches:
      - gitops-ci

env:
   ACR_LOGIN_SERVER: olivesoft.azurecr.io
   IMAGE_NAME: open-webui-custom
   GITOPS_REPO: Olive-Soft-Company/OLIA-GITOPS
   GITOPS_FILE: helm-values/env/dev/olia-values.yaml # Path in the GitOps repo

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Compute short SHA                                                                                                    
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"  

      - name: Login to Azure Container Registry
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login olivesoft.azurecr.io -u olivesoft --password-stdin

      - name: Set up Docker Buildx                                                                                                 
        uses: docker/setup-buildx-action@v3
        
      - name:  Build and push 
        run: |
         docker buildx build \
           --platform linux/amd64,linux/arm64 \
           -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
           -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }} \
           --cache-from type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:cache \
           --cache-to type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:cache,mode=max \
           --push \
           .

      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@master                                                                                     
        with:   
         image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
         exit-code: '1'                                                                                                           
         severity: CRITICAL
         ignore-unfixed: true   

      # Checkout the GitOps Repository using a Personal Access Token (PAT
      - name: Checkout GitOps Repo
        uses: actions/checkout@v3
        with:
              repository: ${{ env.GITOPS_REPO }}
              token: ${{ secrets.GITOPS_PAT }}
              path: gitops-repo
        
      - name: Update Image Tag in Helm 
        run: |
          sed -i 's|^\(\s*tag:\s*\).*|\1"${{ github.sha }}"|' gitops-repo/${{ env.GITOPS_FILE }}
      
      - name: Set up Helm                                                                                                                
        uses: azure/setup-helm@v4
        with:                                                                                                                            
         version: '3.17.0'

      - name: Validate Helm values
        run: |
           helm lint gitops-repo/charts/olia


      - name: Commit and Push
        run: |
          cd gitops-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions-bot@olivesoft.fr"
          git add ${{ env.GITOPS_FILE }}
          git diff --staged --quiet && echo "No changes to commit" && exit 0  
          git commit -m "Deploy : Update Olia image to ${{ github.sha }}" 
          git push origin main
          
             