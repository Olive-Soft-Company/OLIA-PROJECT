      - name: Deploy to Swarm VM
        run: |
          docker login oliarg.azurecr.io -u oliarg -p "${{ secrets.ACR_PASSWORD }}"
          docker pull oliarg.azurecr.io/open-webui-custom:latest
          docker service update -d --with-registry-auth \
            --image oliarg.azurecr.io/open-webui-custom:latest olia_keycloak 
