name: CI/CD Docker Swarm ACR

on:
  push:
    branches:
      - prd

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_KEY }}
      - name: Create .env file from secrets and repository variables
        run: |
          cat .dockerignore
          cat <<EOF > .env
          # Secrets
          GOOGLE_DRIVE_API_KEY=${GOOGLE_DRIVE_API_KEY}
          GOOGLE_DRIVE_CLIENT_ID=${GOOGLE_DRIVE_CLIENT_ID}
          GOOGLE_PSE_API_KEY=${GOOGLE_PSE_API_KEY}
          GOOGLE_PSE_ENGINE_ID=${GOOGLE_PSE_ENGINE_ID}
          IMAGES_OPENAI_API_KEY=${IMAGES_OPENAI_API_KEY}
          OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
          ONEDRIVE_CLIENT_ID_BUSINESS=${ONEDRIVE_CLIENT_ID_BUSINESS}
          ONEDRIVE_CLIENT_ID_PERSONAL=${ONEDRIVE_CLIENT_ID_PERSONAL}
          ONEDRIVE_SHAREPOINT_TENANT_ID=${ONEDRIVE_SHAREPOINT_TENANT_ID}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL}
          OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI}
          WEBUI_AUTH_SIGNOUT_REDIRECT_URL=${WEBUI_AUTH_SIGNOUT_REDIRECT_URL}
      
          # variables
          ENABLE_IMAGE_PROMPT_GENERATION=${ENABLE_IMAGE_PROMPT_GENERATION}
          ENABLE_OAUTH_GROUP_CREATION=${ENABLE_OAUTH_GROUP_CREATION}
          ENABLE_OAUTH_GROUP_MANAGEMENT=${ENABLE_OAUTH_GROUP_MANAGEMENT}
          ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP}
          ENABLE_ONEDRIVE_BUSINESS=${ENABLE_ONEDRIVE_BUSINESS}
          ENABLE_ONEDRIVE_INTEGRATION=${ENABLE_ONEDRIVE_INTEGRATION}
          ENABLE_ONEDRIVE_PERSONAL=${ENABLE_ONEDRIVE_PERSONAL}
          IMAGES_OPENAI_API_BASE_URL=${IMAGES_OPENAI_API_BASE_URL}
          OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
          OAUTH_GROUP_CLAIM=${OAUTH_GROUP_CLAIM}
          OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME}
          OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}
          USER_PERMISSIONS_FEATURES_WEB_SEARCH=${USER_PERMISSIONS_FEATURES_WEB_SEARCH}
          WEBUI_NAME=${WEBUI_NAME}
          WEB_SEARCH_ENGINE=${WEB_SEARCH_ENGINE}
          EOF
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_PSE_API_KEY: ${{ secrets.GOOGLE_PSE_API_KEY }}
          GOOGLE_PSE_ENGINE_ID: ${{ secrets.GOOGLE_PSE_ENGINE_ID }}
          IMAGES_OPENAI_API_KEY: ${{ secrets.IMAGES_OPENAI_API_KEY }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID_BUSINESS: ${{ secrets.ONEDRIVE_CLIENT_ID_BUSINESS }}
          ONEDRIVE_CLIENT_ID_PERSONAL: ${{ secrets.ONEDRIVE_CLIENT_ID_PERSONAL }}
          ONEDRIVE_SHAREPOINT_TENANT_ID: ${{ secrets.ONEDRIVE_SHAREPOINT_TENANT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENID_PROVIDER_URL: ${{ secrets.OPENID_PROVIDER_URL }}
          OPENID_REDIRECT_URI: ${{ secrets.OPENID_REDIRECT_URI }}
          WEBUI_AUTH_SIGNOUT_REDIRECT_URL: ${{ secrets.WEBUI_AUTH_SIGNOUT_REDIRECT_URL }}
          ENABLE_IMAGE_PROMPT_GENERATION: ${{ vars.ENABLE_IMAGE_PROMPT_GENERATION }}
          ENABLE_OAUTH_GROUP_CREATION: ${{ vars.ENABLE_OAUTH_GROUP_CREATION }}
          ENABLE_OAUTH_GROUP_MANAGEMENT: ${{ vars.ENABLE_OAUTH_GROUP_MANAGEMENT }}
          ENABLE_OAUTH_SIGNUP: ${{ vars.ENABLE_OAUTH_SIGNUP }}
          ENABLE_ONEDRIVE_BUSINESS: ${{ vars.ENABLE_ONEDRIVE_BUSINESS }}
          ENABLE_ONEDRIVE_INTEGRATION: ${{ vars.ENABLE_ONEDRIVE_INTEGRATION }}
          ENABLE_ONEDRIVE_PERSONAL: ${{ vars.ENABLE_ONEDRIVE_PERSONAL }}
          IMAGES_OPENAI_API_BASE_URL: ${{ vars.IMAGES_OPENAI_API_BASE_URL }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_GROUP_CLAIM: ${{ vars.OAUTH_GROUP_CLAIM }}
          OAUTH_PROVIDER_NAME: ${{ vars.OAUTH_PROVIDER_NAME }}
          OPENAI_API_BASE_URL: ${{ vars.OPENAI_API_BASE_URL }}
          USER_PERMISSIONS_FEATURES_WEB_SEARCH: ${{ vars.USER_PERMISSIONS_FEATURES_WEB_SEARCH }}
          WEBUI_NAME: ${{ vars.WEBUI_NAME }}
          WEB_SEARCH_ENGINE: ${{ vars.WEB_SEARCH_ENGINE }}

      - name: Login to Azure Container Registry
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login olivesoft.azurecr.io -u olivesoft --password-stdin
      - name: Build Docker image
        run: |
          docker build -t olivesoft.azurecr.io/open-webui-custom:latest .
      - name: Push Docker image to ACR
        run: |
          docker push olivesoft.azurecr.io/open-webui-custom:latest
      - name: Deploy to Swarm VM
        run: |
          ssh -o StrictHostKeyChecking=no azureuser@40.66.43.12 "
            docker login olivesoft.azurecr.io -u olivesoft -p ${{ secrets.ACR_PASSWORD }}
            docker pull olivesoft.azurecr.io/open-webui-custom:latest
            docker service update -d --with-registry-auth --image olivesoft.azurecr.io/open-webui-custom:latest keycloak_webapp
          "
