name: CI/CD Docker Swarm ACR prd test

on:
  push:
    branches:
      - prd-test-chaden

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_KEY_PPD }}
      - name: Login to Azure Container Registry
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login olivesoft.azurecr.io -u olivesoft --password-stdin
      - name: Build Docker image
        run: |
          docker build . \
            --build-arg GOOGLE_DRIVE_API_KEY=${{ secrets.GOOGLE_DRIVE_API_KEY }} \
            --build-arg GOOGLE_DRIVE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID }} \
            --build-arg GOOGLE_PSE_API_KEY=${{ secrets.GOOGLE_PSE_API_KEY }} \
            --build-arg GOOGLE_PSE_ENGINE_ID=${{ secrets.GOOGLE_PSE_ENGINE_ID }} \
            --build-arg IMAGES_OPENAI_API_KEY=${{ secrets.IMAGES_OPENAI_API_KEY }} \
            --build-arg OAUTH_CLIENT_SECRET=${{ secrets.OAUTH_CLIENT_SECRET_PPD }} \
            --build-arg ONEDRIVE_CLIENT_ID_BUSINESS=${{ secrets.ONEDRIVE_CLIENT_ID_BUSINESS }} \
            --build-arg ONEDRIVE_CLIENT_ID_PERSONAL=${{ secrets.ONEDRIVE_CLIENT_ID_PERSONAL }} \
            --build-arg ONEDRIVE_SHAREPOINT_TENANT_ID=${{ secrets.ONEDRIVE_SHAREPOINT_TENANT_ID }} \
            --build-arg OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            --build-arg OPENID_PROVIDER_URL=https://olia-prd.francecentral.cloudapp.azure.com:8443/realms/OliveSoft/.well-known/openid-configuration \
            --build-arg OPENID_REDIRECT_URI=https://olia-prd.francecentral.cloudapp.azure.com/oauth/oidc/callback \
            --build-arg WEBUI_AUTH_SIGNOUT_REDIRECT_URL=https://olia-prd.francecentral.cloudapp.azure.com \
            --build-arg ENABLE_IMAGE_PROMPT_GENERATION=${{ vars.ENABLE_IMAGE_PROMPT_GENERATION }} \
            --build-arg USER_PERMISSIONS_CHAT_CONTROLS=${{ vars.USER_PERMISSIONS_CHAT_CONTROLS }} \
            --build-arg ENABLE_OAUTH_GROUP_CREATION=${{ vars.ENABLE_OAUTH_GROUP_CREATION }} \
            --build-arg ENABLE_OAUTH_GROUP_MANAGEMENT=${{ vars.ENABLE_OAUTH_GROUP_MANAGEMENT }} \
            --build-arg ENABLE_OAUTH_SIGNUP=${{ vars.ENABLE_OAUTH_SIGNUP }} \
            --build-arg ENABLE_ONEDRIVE_BUSINESS=${{ vars.ENABLE_ONEDRIVE_BUSINESS }} \
            --build-arg ENABLE_ONEDRIVE_INTEGRATION=${{ vars.ENABLE_ONEDRIVE_INTEGRATION }} \
            --build-arg ENABLE_ONEDRIVE_PERSONAL=${{ vars.ENABLE_ONEDRIVE_PERSONAL }} \
            --build-arg IMAGES_OPENAI_API_BASE_URL=${{ vars.IMAGES_OPENAI_API_BASE_URL }} \
            --build-arg OAUTH_CLIENT_ID=olia-prd \
            --build-arg OAUTH_GROUP_CLAIM=${{ vars.OAUTH_GROUP_CLAIM }} \
            --build-arg OAUTH_PROVIDER_NAME=${{ vars.OAUTH_PROVIDER_NAME }} \
            --build-arg OPENAI_API_BASE_URL=${{ vars.OPENAI_API_BASE_URL }} \
            --build-arg ONEDRIVE_SHAREPOINT_URL=${{ vars.ONEDRIVE_SHAREPOINT_URL }} \
            --build-arg ENABLE_FORWARD_USER_INFO_HEADERS=${{ vars.ENABLE_FORWARD_USER_INFO_HEADERS }} \
            --build-arg USER_PERMISSIONS_FEATURES_WEB_SEARCH=${{ vars.USER_PERMISSIONS_FEATURES_WEB_SEARCH }} \
            --build-arg WEBUI_NAME=${{ vars.WEBUI_NAME }} \
            --build-arg WEB_SEARCH_ENGINE=${{ vars.WEB_SEARCH_ENGINE }} \
            --build-arg WEBUI_URL=https://olia-ppd.francecentral.cloudapp.azure.com \
            --build-arg ATLASSIAN_CLIENT_ID=${{ secrets.ATLASSIAN_CLIENT_ID }} \
            --build-arg ATLASSIAN_CLIENT_SECRET=${{ secrets.ATLASSIAN_CLIENT_SECRET }} \
            --build-arg ATLASSIAN_REDIRECT_URI=https://olia-prd.francecentral.cloudapp.azure.com/api/oauth/atlassian/callback \
            --build-arg ATLASSIAN_SCOPES="read:jira-work write:jira-work read:jira-user offline_access" \
            --build-arg ATLASSIAN_AUDIENCE=api.atlassian.com \
            --build-arg ATLASSIAN_POST_AUTH_REDIRECT=https://olia-prd.francecentral.cloudapp.azure.com/ \
            -t olivesoft.azurecr.io/open-webui-custom:prd-1.0

      - name: Push Docker image to ACR
        run: |
          docker push olivesoft.azurecr.io/open-webui-custom:prd-1.0
     